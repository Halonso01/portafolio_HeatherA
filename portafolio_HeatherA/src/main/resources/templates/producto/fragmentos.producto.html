<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <section th:fragment="listado" class="p-3">
            <div class="row p-3">
                <div class="col-md-12">
                    <div class="card p-2">
                        <div class="card-header">
                            <h4>Listado de productos</h4>
                        </div>

                        <div class="card-body">
                            <div th:if="${productos != null and !productos.empty}">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Descripción</th>
                                            <th>Detalle</th>
                                            <th>Precio</th>
                                            <th>Existencias</th>
                                            <th>Imagen</th>
                                            <th>Activo</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <tr th:each="p : ${productos}">
                                            <td th:text="${p.idProducto}"></td>
                                            <td th:text="${p.descripcion}"></td>
                                            <td th:text="${p.detalle}"></td>
                                            <td th:text="${p.precio}"></td>
                                            <td th:text="${p.existencias}"></td>
                                            <td>
                                                <img th:if="${p.rutaImagen != null}"
                                                     th:src="@{${p.rutaImagen}}"
                                                     alt="Imagen del producto"
                                                     height="75"/>
                                            </td>
                                            <td th:text="${p.activo} ? 'Activo' : 'Inactivo'"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="text-center p-2"
                                 th:if="${productos == null or productos.empty}">
                                <span>No hay productos registrados.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
